<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frong.ai</title>
    <link rel="icon" href="/logo-dot.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="frong.ai" />
    <meta property="og:title" content="frong.ai" />
    <meta property="og:description" content="Chat with Frong LLM in a private session." />
    <meta property="og:image" content="https://frong.ai/logo.jpg" />
    <meta property="og:url" content="https://frong.ai/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="frong.ai" />
    <meta name="twitter:description" content="Chat with Frong LLM in a private session." />
    <meta name="twitter:image" content="https://frong.ai/logo.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <video
        class="bg-video"
        src="/frong.mp4"
        autoplay
        muted
        loop
        playsinline
      ></video>
    </div>

    <div id="app">

      <div class="stage">
        <section id="gate" class="gate hidden">
          <p class="gate-title">frong.ai</p>
          <p class="gate-copy">Chat with Frong LLM in a private session.</p>
          <!-- OAuth stays at /auth/x — UI gated until we flip FRONG_X_LOGIN_ENABLED -->
          <a
            class="btn-x is-soon"
            id="login-x"
            href="/auth/x"
            aria-disabled="true"
            tabindex="-1"
            title="Coming soon"
          >
            Coming soon
          </a>
        </section>

        <section id="panel" class="panel hidden">
          <div class="panel-bar">
            <span class="whoami" id="whoami"></span>
            <button type="button" class="linkish" id="logout">Log out</button>
          </div>
          <main id="term" class="term" aria-label="Frong chat"></main>
          <form id="composer" class="composer" autocomplete="off">
            <input
              id="input"
              name="message"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="Paste a wallet or CA — or just ask"
              autofocus
            />
            <button type="submit" class="send" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M5 12h12M13 6l6 6-6 6"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </form>
        </section>

        <aside class="dock" aria-label="frong.ai tools">
          <span class="dock-link dock-link-disabled" aria-disabled="true" title="Coming soon">Database</span>
          <span class="dock-link dock-link-disabled" aria-disabled="true" title="Coming soon">Packs</span>
          <span class="dock-link dock-link-disabled" aria-disabled="true" title="Coming soon">API</span>
          <span class="dock-link dock-link-disabled" aria-disabled="true" title="Coming soon">Upload</span>
          <a
            class="dock-link dock-x"
            href="https://x.com/frong_ai"
            target="_blank"
            rel="noopener noreferrer"
            >@frong_ai</a
          >
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

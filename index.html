<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frong.ai</title>
    <link rel="icon" href="/frong.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <video
        class="bg-video"
        src="/frong.mp4"
        autoplay
        muted
        loop
        playsinline
      ></video>
    </div>

    <div id="app">
      <section id="gate" class="gate hidden">
        <p class="gate-title">frong.ai</p>
        <p class="gate-copy">Sign in with X to talk to Frong.</p>
        <a class="btn-x" id="login-x" href="/auth/x">Continue with X</a>
        <button type="button" class="btn-dev hidden" id="login-dev">Dev login</button>
      </section>

      <section id="panel" class="panel hidden">
        <div class="panel-bar">
          <span class="whoami" id="whoami"></span>
          <button type="button" class="linkish" id="logout">Log out</button>
        </div>
        <main id="term" class="term" aria-label="Frong chat"></main>
        <form id="composer" class="composer" autocomplete="off">
          <input
            id="input"
            name="message"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Message frong — paste a wallet or CA"
            autofocus
          />
          <button type="submit" class="send" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M5 12h12M13 6l6 6-6 6"
                stroke="currentColor"
                stroke-width="2.2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </form>
      </section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

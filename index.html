<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frong.ai</title>
    <link rel="icon" href="/frong.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <video
        class="bg-video"
        src="/frong.mp4"
        autoplay
        muted
        loop
        playsinline
      ></video>
    </div>

    <div id="app">
      <div class="stage">
        <section id="gate" class="gate hidden">
          <p class="gate-title">frong.ai</p>
          <p class="gate-copy">A funny frog with a desk-analyst brain. Sign in with X to talk.</p>
          <a class="btn-x" id="login-x" href="/auth/x">
            <svg class="x-mark" viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"
              />
            </svg>
            Continue with X
          </a>
        </section>

        <section id="panel" class="panel hidden">
          <div class="panel-bar">
            <span class="whoami" id="whoami"></span>
            <button type="button" class="linkish" id="logout">Log out</button>
          </div>
          <main id="term" class="term" aria-label="Frong chat"></main>
          <form id="composer" class="composer" autocomplete="off">
            <input
              id="input"
              name="message"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="Paste a wallet or CA — or just ask"
              autofocus
            />
            <button type="submit" class="send" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M5 12h12M13 6l6 6-6 6"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </form>
        </section>

        <aside class="dock" aria-label="frong.ai tools">
          <p class="dock-title">Open</p>
          <a class="dock-link" href="/wallets/">Database</a>
          <a class="dock-link" href="/wallets/packs/">Packs</a>
          <a class="dock-link" href="/wallets/api/">API</a>
          <a class="dock-link" href="/upload/">Upload</a>
          <a
            class="dock-link dock-x"
            href="https://x.com/frong_ai"
            target="_blank"
            rel="noopener noreferrer"
            >@frong_ai</a
          >
        </aside>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
